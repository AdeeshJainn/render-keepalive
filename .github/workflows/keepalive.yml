name: Render keep-alive

# Render's free tier sleeps a web service after 15 min without inbound
# traffic. Ping it every 10 min. Odd minutes avoid GitHub's :00 congestion,
# where scheduled runs get delayed.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: keepalive

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping Render
        env:
          RENDER_URLS: ${{ vars.RENDER_URLS }}
        run: |
          if [ -z "$RENDER_URLS" ]; then
            echo "::error::Set the RENDER_URLS repo variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          failed=0
          for url in $(echo "$RENDER_URLS" | tr ',' ' '); do
            # Generous timeout + retries: a cold start can take ~1 min.
            if out=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
                          -o /dev/null -w "%{http_code} %{time_total}s" "$url"); then
              echo "OK   $url -> $out"
            else
              echo "::error::FAIL $url"
              failed=1
            fi
          done
          exit $failed

      # GitHub disables scheduled workflows in public repos after 60 days with
      # no repo activity. A commit once a week keeps this one alive.
      - uses: actions/checkout@v5
        if: always()
      - name: Weekly heartbeat commit
        if: always()
        run: |
          now=$(date +%s)
          last=$(cat heartbeat.txt 2>/dev/null || echo 0)
          if [ $((now - last)) -lt 604800 ]; then
            echo "Heartbeat is fresh; nothing to commit."
            exit 0
          fi
          echo "$now" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Keep-alive heartbeat"
          git push
